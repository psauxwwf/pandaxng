---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

dotenv: ["build.env"]

vars:
  GOBIN: go
  LDFLAGS: "-extldflags '-static' -w -s -buildid="
  GCFLAGS: "all=-dwarf=false -l"
  BIN: "{{.ROOT_DIR}}/bin"
  APP: pandaxng
  APP_BIN: "{{.BIN}}/{{.APP}}"
  REPO_NAME:
    sh: basename "{{.ROOT_DIR}}"
  RELEASE_LINUX_ARCHIVE: "{{.BIN}}/{{.REPO_NAME}}_linux_amd64.tar.gz"

env:
  CGO_ENABLED: "0"
  GOARCH: amd64
  GOOS: linux

tasks:
  setup:
    desc: Set up the build directory
    internal: true
    silent: true
    cmds:
      - mkdir -p "{{.BIN}}"

  build:
    desc: Build the static Linux amd64 binary
    dir: "{{.ROOT_DIR}}"
    deps: [setup]
    cmds:
      - >
        {{.GOBIN}} build
        -tags netgo
        -ldflags="{{.LDFLAGS}}"
        -trimpath
        -gcflags="{{.GCFLAGS}}"
        -o "{{.APP_BIN}}"
        ./cmd/{{.APP}}
      - strip "{{.APP_BIN}}"
      - objcopy --strip-unneeded "{{.APP_BIN}}"

  release:
    desc: Build and publish a GitHub release
    dir: "{{.ROOT_DIR}}"
    deps: [build]
    cmds:
      - tar -czf "{{.RELEASE_LINUX_ARCHIVE}}" -C "{{.BIN}}" "{{.APP}}"
      - |
        TAG=$(date +v%m.%d.%H)
        gh release create "$TAG" "{{.RELEASE_LINUX_ARCHIVE}}"
